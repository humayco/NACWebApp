<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITC505 - Lab 7 Mad Lib</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Lab 7 - Mad Lib Generator</h1>
    <p>Fill out the form to create your own silly story!</p>

    <form action="/ITC505/lab-7" method="POST">
        <label>Noun: <input type="text" name="noun" required></label><br>
        <label>Adjective: <input type="text" name="adjective" required></label><br>
        <label>Verb: <input type="text" name="verb" required></label><br>
        <label>Place: <input type="text" name="place" required></label><br>
        <label>Plural Noun: <input type="text" name="pluralNoun" required></label><br><br>

        <button type="submit">Create My Story</button>
    </form>

    <footer>
        <p>Last updated: <span id="lastModified"></span></p>
    </footer>

    <script>
        var x = document.lastModified;
        document.getElementById("lastModified").textContent = x;
    </script>
</body>
</html>
